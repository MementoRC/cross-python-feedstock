schema_version: 1

context:
  build_number: 57

package:
  name: cross-python_${{ cross_target_platform|default("linux-64") }}
  version: ${{ version|default("0.1") }}

build:
  number: ${{ build_number }}
  string: ${{ build_number }}_${{ py_impl }}
  # also on Windows, where bash comes from m2-bash in the build env
  script: build.sh
  skip:
    # FORK-ONLY: only the win lanes while iterating; drop before upstream
    - unix
    - cross_target_platform == target_platform
    # win-arm64 is the only Windows cross target, and it is built from win-64
    - win and cross_target_platform != "win-arm64"
    - unix and cross_target_platform == "win-arm64"
    # conda-forge ships win-arm64 python only for 3.14 and later
    - cross_target_platform == "win-arm64" and version not in ("3.14", "3.15")
  variant:
    # freethreading is only referenced under `tests` for non-osx targets, so
    # rattler-build prunes it from the build env for osx cross targets and
    # build.sh dies on `set -u`. It is needed on every target: PY_THREAD is
    # substituted into activate-cross-python.sh unconditionally.
    use_keys:
      - freethreading

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      else:
        - m2-bash
        - m2-coreutils
  host:
  run:
    - python ${{ version }}.* *_${{ py_impl }}
    - if: unix
      then:
        - crossenv >=1.1.4
        - rsync
        - sed
    - if: cross_target_platform in ("osx-64", "osx-arm64")
      then: clangxx_impl_${{ cross_target_platform }}
      else:
        - if: cross_target_platform == "win-arm64"
          then: vs_${{ cross_target_platform }}
          else: gxx_impl_${{ cross_target_platform }}
  run_exports:
    strong:
      - python ${{ version }}.* *_${{ py_impl }}

tests:
  - if: unix and cross_target_platform not in ("osx-64", "osx-arm64")
    then:
      - script:
        - test -f $PREFIX/etc/conda/activate.d/activate_z-cross-python_${{ cross_target_platform }}.sh
        - echo ${{ freethreading }}
  - if: win
    then:
      - script:
        - if not exist %PREFIX%\etc\conda\activate.d\activate_z-cross-python_${{ cross_target_platform }}.bat exit 1
        - if not exist %PREFIX%\etc\conda\deactivate.d\deactivate_z-cross-python_${{ cross_target_platform }}.bat exit 1
        - if not exist %PREFIX%\etc\conda\cross-python\sitecustomize.py exit 1
        - echo ${{ freethreading }}
        # run the activation as a downstream build would, then check that
        # the build python reports the target platform
        - set CONDA_BUILD=1
        - set CONDA_BUILD_STATE=
        - set "BUILD_PREFIX=%PREFIX%"
        - call %PREFIX%\etc\conda\activate.d\activate_z-cross-python_${{ cross_target_platform }}.bat
        - python -c "import sysconfig; p = sysconfig.get_platform(); s = sysconfig.get_config_var('EXT_SUFFIX'); print(p, s); assert p == '${{ cross_target_platform }}' and s.endswith('-win_arm64.pyd')"

about:
  license: LicenseRef-OTHER
  # The package ships only conda-forge-authored recipe scripts, which are
  # BSD-3-Clause; this is the same text conda-smithy emits as
  # recipe-scripts-license.txt.
  license_file: LICENSE.txt
  summary: A meta-package to set up a cross compiling env for python in conda-build
  homepage: https://github.com/conda-forge/cross-python-feedstock

extra:
  recipe-maintainers:
    - chrisburr
    - isuruf
  feedstock-name: cross-python
