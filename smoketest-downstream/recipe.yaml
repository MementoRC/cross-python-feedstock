# FORK-ONLY: a real downstream cross build that uses cross-python the way a
# feedstock would; run by .github/workflows/downstream-smoke.yml.
schema_version: 1

package:
  name: cross-python-smoke
  version: "0.1"

source:
  path: src

build:
  number: 0
  script:
    # renders to the literal %PREFIX%\python.exe of the win-arm64 python
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - cross-python_${{ target_platform }} 3.14.* *_cp314
    - python 3.14.* *_cp314
    - setuptools
    - pip
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python 3.14.* *_cp314
    - setuptools
    - pip
  run:
    - python

about:
  license: BSD-3-Clause
  summary: Downstream smoke test for cross-python on win-arm64
